<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe6ff">

  <!-- تطبيق الجوال (PWA) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="يومي">
  <title>يومي ✦ ترتيب حياتي</title>

  <!-- الخطوط: تجوال للنصوص، وريم كوفي للعناوين -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- فقاعات الخلفية الباستيل -->
  <div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <main id="app">
    <section class="view" id="view-today"></section>
    <section class="view" id="view-schedule"></section>
    <section class="view" id="view-goals"></section>
    <section class="view" id="view-money"></section>
    <section class="view" id="view-uni"></section>
    <section class="view" id="view-cycle"></section>
  </main>

  <!-- الشريط السفلي + زر الإضافة -->
  <div class="dock">
    <div class="dock-in">
      <button class="fab" id="fab" data-act="fab" aria-label="إضافة"></button>
      <nav class="tabbar" id="tabbar"></nav>
    </div>
  </div>

  <!-- النافذة المنبثقة للنماذج -->
  <div class="sheet" id="sheet"></div>

  <noscript>فعّل JavaScript عشان يشتغل التطبيق.</noscript>
  <script src="app.js"></script>
  <script>
    /* تسجيل الـ service worker (يشتغل فقط على رابط http/https وليس على ملف محلي) */
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
